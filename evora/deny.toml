# cargo-deny : politique Evora pour le build web de Lumbra (fork tazerty/photocraft).
#
# L'amont n'a pas de deny.toml (aucune politique de licences ni d'audit d'advisories) : ce fichier
# est minimal et écrit par Evora. Il ne relâche rien en silence : chaque licence admise et chaque
# exception est listée ici, avec sa raison ; les avertissements de cargo-deny (doublons de
# versions, licences admises inutilisées) restent affichés dans le journal et dans le résumé du job.
#
# Graphe audité : la crate apps/photocraft-web (ce que l'artefact web embarque), cible
# wasm32-unknown-unknown, dépendances de développement exclues, features passées par la CI
# d'après index.html (data-cargo-features). Lancé par .github/workflows/evora-web.yml.

[graph]
targets = ["wasm32-unknown-unknown"]
exclude-dev = true

[advisories]
# Base RustSec, clonée en CI. Vulnérabilités et avis « unsound » : erreurs. Crates non maintenues :
# erreur aussi (valeur par défaut « all », rappelée ici). Versions retirées (yanked) : erreur.
unmaintained = "all"
unsound = "all"
yanked = "deny"
# Exceptions explicites, relevées par la porte au premier passage (run 38367884596) : crates
# transitives du graphe amont, sans vulnérabilité connue ; les remplacer imposerait de modifier
# Cargo.lock et les crates de l'amont (hors périmètre du fork). Chaque exception reste visible
# dans le journal (note de cargo-deny) et dans apps/lumbra/UPSTREAM.md ; à revoir à chaque montée.
ignore = [
    { id = "RUSTSEC-2024-0436", reason = "paste 1.0.15 non maintenu (macro de compilation, aucune vulnérabilité), transitif via l'amont" },
    { id = "RUSTSEC-2026-0206", reason = "rustybuzz 0.20.1 non maintenu (aucune vulnérabilité), transitif via l'amont ; l'amont migre vers harfrust" },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser 0.25.1 non maintenu (aucune vulnérabilité), transitif via l'amont" },
    { crate = "yoke-derive@0.8.3", reason = "version retirée (yanked) épinglée par le Cargo.lock de l'amont ; mise à jour = modification du verrou de l'amont" },
]

[licenses]
# Licences permissives admises pour le code embarqué dans le wasm. Aucune licence copyleft (GPL,
# LGPL, AGPL) : un paquet qui n'offre qu'une telle licence fait échouer la porte.
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Zlib",
    "0BSD",
    "CC0-1.0",
    "Unlicense",
    "Unicode-3.0",
]
confidence-threshold = 0.8
# Exceptions par crate, limitées aux licences de données qu'elles embarquent.
exceptions = [
    # Polices par défaut d'egui (Ubuntu Light, Hack, emoji-icon-font ; Noto Emoji retirée par E10) :
    # licences de polices libres, incorporation dans une application permise.
    { crate = "epaint_default_fonts", allow = ["OFL-1.1", "Ubuntu-font-1.0"] },
    # Encodeur JPEG dérivé du code de l'Independent JPEG Group : licence IJG, permissive avec mention.
    { crate = "jpeg-encoder", allow = ["IJG"] },
]

[licenses.private]
# Les crates du dépôt non publiées (photocraft-*) sont sous MIT OR Apache-2.0 (Cargo.toml du
# workspace) ; elles restent auditées comme les autres.
ignore = false

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# craft-ui (storytold/craft-libs, Apache-2.0), épinglée par révision dans Cargo.lock.
# Depuis v0.10.0 (EVORA-LUM-49) : craft-print (craft-libs) dépend sans condition de
# craft-winprint-gdi (storytold/winprint.rs, MIT OR Apache-2.0, révision 417ac3c4 épinglée par
# craft-print et Cargo.lock). Sur wasm32, seuls ses types et des fonctions qui répondent
# « Unsupported » sont compilés : son module Win32 et sa seule dépendance (windows-sys) sont
# réservés à cfg(windows), et unsafe_code y est refusé hors de ce module. Même organisation que
# craft-libs ; l'amont pdfcraft admet ce dépôt dans son propre deny.toml.
allow-git = ["https://github.com/storytold/craft-libs", "https://github.com/storytold/winprint.rs"]
