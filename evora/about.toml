# cargo-about : licences des crates Rust embarquées dans le build web de Lumbra (fork Evora de
# storytold/photocraft). Produit LICENSES/THIRD-PARTY-RUST.html dans l'artefact. Même liste de
# licences que evora/deny.toml, dans l'ordre de préférence (la première qui satisfait l'expression
# d'une crate est retenue).
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Zlib",
    "0BSD",
    "MIT-0",
    "CC0-1.0",
    "Unlicense",
    "Unicode-3.0",
]
targets = ["wasm32-unknown-unknown"]
ignore-dev-dependencies = true
ignore-build-dependencies = false

# Licences de données propres à deux crates (mêmes exceptions que evora/deny.toml).
[epaint_default_fonts]
accepted = ["OFL-1.1", "Ubuntu-font-1.0"]

[jpeg-encoder]
accepted = ["IJG"]
