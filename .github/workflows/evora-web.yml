# Evora web : CI du fork tazerty/photocraft, futur moteur d'Evora Lumbra.
#
# Écrite par Evora à partir de packaging/web/package.sh, packaging/env.sh et de la section
# « Web build » de docs/development.md (code du dépôt, MIT OR Apache-2.0). Rien n'est repris de
# storytold/craft-common-actions. Aucune action tierce : seules actions/checkout, actions/cache et
# actions/upload-artifact, épinglées par SHA complet. Les outils (Trunk, wasm-bindgen, wasm-opt,
# cargo-deny, cargo-about) sont téléchargés depuis leurs releases officielles à une version fixe et
# vérifiés par SHA-256 ; Trunk tourne hors ligne, il ne peut donc rien télécharger d'autre.
#
# Portes bloquantes (EVORA-LUM-NN CI, après E1) : cargo-deny (licences, advisories, sources,
# doublons en avertissement), cargo-about (LICENSES/THIRD-PARTY-RUST.html), marques ArtCraft,
# fichiers d'hébergement, LICENSES/ complet, émojis des catalogues affichés (résolus dans la pile de
# polices d'egui), précompression .br/.gz et empreintes CSP, test de fumée Chrome sans interface en
# origine différente (evora/ci/), hors pont puis avec le pont hôte EHP v1 (E4, scénario « pont-ehp »)
# et le pont muet (evora-host.json de l'artefact, vide), le scénario « pont-documents » (E5 pour
# plusieurs documents moteur de la même origine, HOST-PROTOCOL §7.7 : quatre variantes), puis les
# témoins sabordés de ces bancs : chacun n'est VALIDE que si ses rouges sont exactement ceux attendus,
# chacun à sa place (autotest du verdict sans navigateur, témoins « banc », « moteur », « muet » et
# « ecoutes »). Puis un build de fumée (feature evora-smoke, jamais empaqueté) prouve que la panique
# du moteur parvient à la coquille (scénario « pont-panique », LUM-04) ; son marqueur doit être absent
# du .wasm servi.
# Chaque porte s'exécute même si une autre échoue ; le bilan échoue s'il en manque une, et l'artefact
# n'est publié qu'après un bilan vert.
#
# Sortie : artefact evora-lumbra-web-<tag> (evora-lumbra-web-<tag>.zip : site statique, .br et .gz,
# LICENSES/, csp-hashes.txt ; evora-lumbra-fonts-<tag>.zip : polices servies à part ; SHA256SUMS ;
# csp-hashes.txt).
name: Evora web

on:
  push:
    branches: ["evora/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evora-web-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  # Tag amont épinglé (D-19) et son commit.
  UPSTREAM_TAG: v0.8.2
  UPSTREAM_COMMIT: d43db3e153c76aefce9b32cef9099e458eaf17a8
  # Pas de rust-toolchain(.toml) au tag : stable exacte, >= rust-version 1.95 du workspace.
  RUST_TOOLCHAIN: 1.99.0
  # Trunk 0.21.14 (même version que la CI amont), binaire officiel trunk-rs.
  TRUNK_VERSION: 0.21.14
  TRUNK_SHA256: f2b4680cd239693a646a2795e4633c625328d7b2a044fbe749fa3a2fe9e7036b
  # wasm-bindgen : version imposée par Cargo.lock ; Trunk exige cette version exacte.
  WASM_BINDGEN_VERSION: 0.2.129
  WASM_BINDGEN_SHA256: 82d12bb940e2d4e72e0d5605387fc1b8ca179044e012b620f0ce4e7440e8320e
  # wasm-opt : version par défaut de Trunk 0.21.14 (celle que l'amont obtient sans réglage).
  BINARYEN_VERSION: version_123
  BINARYEN_SHA256: e959f2170af4c20c552e9de3a0253704d6a9d2766e8fdb88e4d6ac4bae9388fe
  # Plafond de packaging/web/package.sh (24 MiB), affiché pour information seulement.
  UPSTREAM_WASM_LIMIT_BYTES: "25165824"
  # Portes d'audit (EmbarkStudios, binaires musl officiels).
  CARGO_DENY_VERSION: 0.20.2
  CARGO_DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
  CARGO_ABOUT_VERSION: 0.9.2
  CARGO_ABOUT_SHA256: 9099a59e820c38a68b9d65f300662a567d56562f9a10f6aa4c7e86c17c2566af
  # Polices servies à part (E6) : craft-fonts épinglé par révision (celle que cite pdfcraft).
  CRAFT_FONTS_REPO: https://github.com/storytold/craft-fonts
  CRAFT_FONTS_REF: 3d9ab3a132ed0eff457e424226a435a901da30d3
  # Portes à mesure tant que le patch correspondant n'est pas posé (report), bloquantes ensuite (block).
  EVORA_GATE_TERMS: block
  EVORA_GATE_CODE_EMOJI: block

defaults:
  run:
    shell: bash

jobs:
  web:
    name: Build web (wasm) et empaquetage
    # Image épinglée : ubuntu-latest bascule vers Ubuntu 26 le 2026-10-19 ; Chrome, Node et brotli
    # viennent de l'image, et target/ du cache ne doit jamais passer d'une image à l'autre.
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 50

      - name: Vérifier la base amont
        run: |
          git cat-file -e "${UPSTREAM_COMMIT}^{commit}" \
            || { echo "::error::commit amont ${UPSTREAM_COMMIT} absent de l'historique récupéré"; exit 1; }
          git merge-base --is-ancestor "$UPSTREAM_COMMIT" HEAD \
            || { echo "::error::la branche ne descend pas de ${UPSTREAM_TAG} (${UPSTREAM_COMMIT})"; exit 1; }
          version=$(awk '/^\[/ { in_pkg = ($0 == "[workspace.package]"); next }
            in_pkg && $1 == "version" { gsub(/[" ]/, "", $3); print $3; exit }' Cargo.toml)
          [ "$version" = "${UPSTREAM_TAG#v}" ] \
            || { echo "::error::Cargo.toml annonce $version, attendu ${UPSTREAM_TAG#v}"; exit 1; }
          echo "UPSTREAM_VERSION=$version" >> "$GITHUB_ENV"
          echo "Base amont ${UPSTREAM_TAG} (${UPSTREAM_COMMIT}) vérifiée ; HEAD $(git rev-parse HEAD)"

      - name: Toolchain Rust (rustup)
        run: |
          if [ -f rust-toolchain.toml ] || [ -f rust-toolchain ]; then
            echo "::notice::rust-toolchain du dépôt utilisé"
            cat rust-toolchain.toml rust-toolchain 2>/dev/null || true
            rustup toolchain install --no-self-update
          else
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --no-self-update
            rustup default "$RUST_TOOLCHAIN"
          fi
          rustup target add wasm32-unknown-unknown
          rustc -Vv
          cargo -V
          echo "RUSTC_VERSION=$(rustc -V)" >> "$GITHUB_ENV"

      - name: Image du runner (épinglée)
        run: |
          # L'image se lit dans /etc/os-release : elle entre dans la clé du cache (target/ compilé
          # sur une image n'est jamais restauré sur une autre) et doit être celle de runs-on.
          . /etc/os-release
          image="${ID}-${VERSION_ID}"
          echo "Image du runner : ${image} (ImageOS ${ImageOS:-?}, ImageVersion ${ImageVersion:-?})"
          [ "$image" = "ubuntu-24.04" ] \
            || { echo "::error::image du runner ${image}, attendue ubuntu-24.04 (runs-on)"; exit 1; }
          echo "EVORA_IMAGE=${image}" >> "$GITHUB_ENV"

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: evora-web-${{ runner.os }}-${{ env.EVORA_IMAGE }}-rust-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            evora-web-${{ runner.os }}-${{ env.EVORA_IMAGE }}-rust-${{ env.RUST_TOOLCHAIN }}-

      - name: Outils épinglés (Trunk, wasm-bindgen, wasm-opt, cargo-deny, cargo-about)
        run: |
          tools="$RUNNER_TEMP/evora-tools"
          mkdir -p "$tools/dl" "$tools/bin" "$tools/wasm-bindgen" "$tools/binaryen"
          fetch() { # url fichier sha256
            curl -fsSL --retry 3 --proto '=https' --tlsv1.2 "$1" -o "$tools/dl/$2"
            echo "$3  $tools/dl/$2" | sha256sum -c -
          }
          fetch "https://github.com/trunk-rs/trunk/releases/download/v${TRUNK_VERSION}/trunk-x86_64-unknown-linux-gnu.tar.gz" \
            trunk.tar.gz "$TRUNK_SHA256"
          tar -xzf "$tools/dl/trunk.tar.gz" -C "$tools/bin" trunk
          fetch "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/${WASM_BINDGEN_VERSION}/wasm-bindgen-${WASM_BINDGEN_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            wasm-bindgen.tar.gz "$WASM_BINDGEN_SHA256"
          tar -xzf "$tools/dl/wasm-bindgen.tar.gz" -C "$tools/wasm-bindgen"
          fetch "https://github.com/WebAssembly/binaryen/releases/download/${BINARYEN_VERSION}/binaryen-${BINARYEN_VERSION}-x86_64-linux.tar.gz" \
            binaryen.tar.gz "$BINARYEN_SHA256"
          tar -xzf "$tools/dl/binaryen.tar.gz" -C "$tools/binaryen"
          fetch "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            cargo-deny.tar.gz "$CARGO_DENY_SHA256"
          mkdir -p "$tools/audit"
          tar -xzf "$tools/dl/cargo-deny.tar.gz" -C "$tools/audit"
          fetch "https://github.com/EmbarkStudios/cargo-about/releases/download/${CARGO_ABOUT_VERSION}/cargo-about-${CARGO_ABOUT_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            cargo-about.tar.gz "$CARGO_ABOUT_SHA256"
          tar -xzf "$tools/dl/cargo-about.tar.gz" -C "$tools/audit"
          for b in cargo-deny cargo-about; do
            f=$(find "$tools/audit" -type f -name "$b" -print -quit)
            [ -n "$f" ] || { echo "::error::$b introuvable après extraction"; exit 1; }
            install -m 0755 "$f" "$tools/bin/$b"
          done
          rm -f "$tools"/dl/*.tar.gz
          wb=$(find "$tools/wasm-bindgen" -type f -name wasm-bindgen -print -quit)
          wo=$(find "$tools/binaryen" -type f -name wasm-opt -print -quit)
          [ -n "$wb" ] && [ -n "$wo" ] || { echo "::error::wasm-bindgen ou wasm-opt introuvable après extraction"; exit 1; }
          echo "$tools/bin" >> "$GITHUB_PATH"
          dirname "$wb" >> "$GITHUB_PATH"
          dirname "$wo" >> "$GITHUB_PATH"

      - name: Versions des outils
        run: |
          trunk --version
          wasm-bindgen --version
          wasm-opt --version
          [ "$(wasm-bindgen --version | cut -d' ' -f2)" = "$WASM_BINDGEN_VERSION" ]
          [ "version_$(wasm-opt --version | cut -d' ' -f3)" = "$BINARYEN_VERSION" ]
          cargo deny --version
          cargo about --version
          [[ "$(cargo deny --version)" == *"$CARGO_DENY_VERSION"* ]]
          [[ "$(cargo about --version)" == *"$CARGO_ABOUT_VERSION"* ]]
          # Outils de l'image (ni épinglés ni téléchargés) : présents, et Node au moins au major sur
          # lequel le banc de fumée a été éprouvé (22, image ubuntu-24.04, run 38736104775).
          command -v google-chrome >/dev/null || { echo "::error::google-chrome absent de l'image"; exit 1; }
          google-chrome --version
          node --version
          node_major=$(node --version | sed -E 's/^v([0-9]+)\..*/\1/')
          [ "$node_major" -ge 22 ] || { echo "::error::Node ${node_major} : le banc de fumée a été éprouvé sur Node 22"; exit 1; }
          brotli --version

      - name: Dépendances (Cargo.lock verrouillé)
        run: |
          cargo fetch --locked
          # Features du build web, telles qu'index.html les impose à Trunk (data-cargo-features) :
          # cargo-deny et cargo-about auditent exactement ce graphe.
          features=$(sed -n 's/.*data-cargo-features="\([^"]*\)".*/\1/p' apps/photocraft-web/index.html | head -n 1)
          echo "EVORA_FEATURES=$features" >> "$GITHUB_ENV"
          echo "Features du build web : ${features:-(aucune)}"

      - name: Porte cargo-deny (licences, advisories, sources, doublons)
        id: deny
        continue-on-error: true
        run: |
          feat=()
          [ -n "$EVORA_FEATURES" ] && feat=(--features "$EVORA_FEATURES")
          set +e
          cargo deny --manifest-path apps/photocraft-web/Cargo.toml --config evora/deny.toml \
            --target wasm32-unknown-unknown --exclude-dev --locked "${feat[@]}" \
            check --show-stats > "$RUNNER_TEMP/cargo-deny.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/cargo-deny.log"
          errors=$(grep -c '^error' "$RUNNER_TEMP/cargo-deny.log" || true)
          warnings=$(grep -c '^warning' "$RUNNER_TEMP/cargo-deny.log" || true)
          {
            echo "### Porte cargo-deny (bloquante)"
            echo
            echo "Graphe : apps/photocraft-web, wasm32-unknown-unknown, features \`${EVORA_FEATURES:-aucune}\`, sans dépendances de développement. Code de sortie : $status ; lignes error : $errors ; lignes warning : $warnings."
            echo
            echo '```'
            grep -E '^ *(advisories|bans|licenses|sources) ' "$RUNNER_TEMP/cargo-deny.log" | tail -n 8 || true
            echo '```'
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Build web release (Trunk, hors ligne)
        working-directory: apps/photocraft-web
        run: |
          export PHOTOCRAFT_BUILD_SHA="$GITHUB_SHA"
          export PHOTOCRAFT_BUILD_DATE="$(date -u +%Y-%m-%d)"
          # index.html choisit le profil wasm-release, les features et wasm-opt -Oz.
          # --offline accepte une valeur facultative : sans « =true », il avalerait « build ».
          trunk --offline=true build --release --locked
          test -s ../../dist/web/index.html
          git diff --exit-code -- ../../Cargo.lock

      - name: Porte cargo-about (licences tierces agrégées)
        id: about
        continue-on-error: true
        run: |
          about="$RUNNER_TEMP/evora-about"
          mkdir -p "$about"
          feat=()
          [ -n "$EVORA_FEATURES" ] && feat=(--features "$EVORA_FEATURES")
          set +e
          cargo about generate --locked --fail --manifest-path apps/photocraft-web/Cargo.toml \
            -c evora/about.toml "${feat[@]}" -o "$about/THIRD-PARTY-RUST.html" \
            evora/about.hbs > "$RUNNER_TEMP/cargo-about.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/cargo-about.log"
          [ -s "$about/THIRD-PARTY-RUST.html" ] || status=1
          {
            echo "### Porte cargo-about (bloquante)"
            echo
            echo "Code de sortie : $status ; LICENSES/THIRD-PARTY-RUST.html : $(wc -c < "$about/THIRD-PARTY-RUST.html" 2>/dev/null || echo 0) octets, $(grep -c '<li>' "$about/THIRD-PARTY-RUST.html" 2>/dev/null || echo 0) entrées de liste."
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Empaquetage du site statique
        run: |
          site="dist/web"
          # Même contrôle que package.sh : URL relatives (public_url = "./"), le site doit
          # fonctionner sous n'importe quel préfixe et dans une iframe.
          if grep -Eq '(src|href)="/[^/]' "$site/index.html"; then
            echo "::error::$site/index.html contient des URL absolues depuis la racine"
            exit 1
          fi
          ls "$site"/*.wasm >/dev/null
          # Nom Evora, posé après E1 et les portes au vert (EVORA-LUM-02 à 11).
          name="evora-lumbra-web-${UPSTREAM_TAG}"
          # Dossiers neufs à chaque exécution : rien à nettoyer.
          work=$(mktemp -d "$RUNNER_TEMP/evora-package.XXXXXX")
          out=$(mktemp -d "$RUNNER_TEMP/evora-out.XXXXXX")
          mkdir -p "$work/$name/LICENSES"
          cp -R "$site/." "$work/$name/"
          # Licences et mentions (liste du Dockerfile amont). Contrairement à package.sh, ni
          # _headers ni .htaccess ni HOSTING.md : l'hébergement est l'affaire d'Evora (LUM-08).
          cp LICENSE-MIT LICENSE-APACHE NOTICE ATTRIBUTION.md \
            assets/fonts/OFL-*.txt assets/icons/LICENSE-*.txt assets/dict/LICENSE-*.txt \
            crates/ui-egui/src/i18n/LICENSE-translations.txt \
            "$work/$name/LICENSES/"
          # Patch E1 : la seule mention ArtCraft conservée, en texte simple, vit dans les mentions.
          cp evora/MENTIONS.txt "$work/$name/LICENSES/MENTIONS.txt"
          # Patch E4 : origines parentes admises par le pont EHP (?host=evora). Vide dans l'artefact :
          # le provisionnement d'Evora l'écrit (HOST-PROTOCOL §2.3) ; vide, le pont reste muet.
          printf '{"parentOrigins": []}\n' > "$work/$name/evora-host.json"
          # Licences des crates Rust embarquées (cargo-about), si la porte l'a produit.
          if [ -s "$RUNNER_TEMP/evora-about/THIRD-PARTY-RUST.html" ]; then
            cp "$RUNNER_TEMP/evora-about/THIRD-PARTY-RUST.html" "$work/$name/LICENSES/"
          fi
          # Empreintes CSP des scripts en ligne d'index.html (politique cible, ARCHITECTURE §3.6).
          python3 -I evora/ci/csp_hashes.py "$work/$name/index.html" "$work/$name/csp-hashes.txt"
          {
            echo "product: Evora Lumbra (moteur web)"
            echo "upstream: storytold/photocraft ${UPSTREAM_TAG} (${UPSTREAM_COMMIT})"
            echo "fork: ${GITHUB_REPOSITORY} ${GITHUB_REF_NAME} (${GITHUB_SHA})"
            echo "run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "rustc: ${RUSTC_VERSION}"
            echo "trunk: ${TRUNK_VERSION}"
            echo "wasm-bindgen: ${WASM_BINDGEN_VERSION}"
            echo "wasm-opt: ${BINARYEN_VERSION}"
            echo "cargo-deny: ${CARGO_DENY_VERSION}"
            echo "cargo-about: ${CARGO_ABOUT_VERSION}"
            echo "features: ${EVORA_FEATURES}"
            echo "date: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > "$work/$name/EVORA-BUILD.txt"
          # Précompression des fichiers servis (le serveur choisit selon Accept-Encoding).
          find "$work/$name" -path "$work/$name/LICENSES" -prune -o -type f \
            \( -name '*.wasm' -o -name '*.js' -o -name '*.html' -o -name '*.css' \) -print0 \
            | while IFS= read -r -d '' f; do
                gzip -9 -n -k -f "$f"
                brotli -q 11 -k -f "$f"
              done
          (cd "$work" && zip -qrX9 "$out/$name.zip" "$name")
          cp "$work/$name/csp-hashes.txt" "$out/csp-hashes.txt"
          (cd "$out" && sha256sum "$name.zip" csp-hashes.txt > SHA256SUMS)
          cat "$out/SHA256SUMS"
          ls -l "$out"
          echo "EVORA_PKG_DIR=$work/$name" >> "$GITHUB_ENV"
          echo "EVORA_OUT_DIR=$out" >> "$GITHUB_ENV"
          echo "EVORA_ARTIFACT=$name" >> "$GITHUB_ENV"
          {
            echo "## Evora web : ${name}"
            echo
            echo "| Élément | Valeur |"
            echo "| --- | --- |"
            echo "| Amont | storytold/photocraft \`${UPSTREAM_TAG}\` (\`${UPSTREAM_COMMIT}\`) |"
            echo "| Branche | \`${GITHUB_REF_NAME}\` (\`${GITHUB_SHA}\`) |"
            echo "| Toolchain | ${RUSTC_VERSION} ; Trunk ${TRUNK_VERSION} ; wasm-bindgen ${WASM_BINDGEN_VERSION} ; wasm-opt ${BINARYEN_VERSION} |"
            echo "| Archive | \`${name}.zip\`, $(wc -c < "$out/${name}.zip" | tr -d ' ') octets |"
            echo "| SHA-256 | \`$(grep "${name}.zip" "$out/SHA256SUMS" | cut -d' ' -f1)\` |"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Polices servies à part (E6, craft-fonts épinglé)
        run: |
          # craft-fonts à la révision épinglée (CRAFT_FONTS_REF), récupérée par son SHA ; chaque
          # police est vérifiée contre l'empreinte SHA-256 de son manifeste (evora/ci/fonts.py).
          src=$(mktemp -d "$RUNNER_TEMP/craft-fonts.XXXXXX")
          git -C "$src" init -q
          git -C "$src" fetch -q --depth 1 "$CRAFT_FONTS_REPO" "$CRAFT_FONTS_REF"
          git -C "$src" -c advice.detachedHead=false checkout -q FETCH_HEAD
          [ "$(git -C "$src" rev-parse HEAD)" = "$CRAFT_FONTS_REF" ] \
            || { echo "::error::craft-fonts n'est pas à la révision épinglée $CRAFT_FONTS_REF"; exit 1; }
          fname="evora-lumbra-fonts-${UPSTREAM_TAG}"
          fwork=$(mktemp -d "$RUNNER_TEMP/evora-fonts.XXXXXX")
          python3 -I evora/ci/fonts.py "$src" "$fwork/$fname"
          {
            echo "craft-fonts: ${CRAFT_FONTS_REPO} ${CRAFT_FONTS_REF}"
            echo "fork: ${GITHUB_REPOSITORY} ${GITHUB_REF_NAME} (${GITHUB_SHA})"
            echo "run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "usage: copier fonts/ à côté de index.html ; le moteur lit fonts/manifest.txt et télécharge chaque police à la demande (intégrité SRI)"
          } > "$fwork/$fname/EVORA-FONTS.txt"
          # Précompression Brotli des polices (le serveur choisit selon Accept-Encoding).
          find "$fwork/$fname/fonts" -type f \( -name '*.ttf' -o -name '*.otf' -o -name '*.ttc' \) -print0 \
            | xargs -0 -n 1 -P 4 brotli -q 11 -k -f
          (cd "$fwork" && zip -qrX9 "$EVORA_OUT_DIR/$fname.zip" "$fname")
          (cd "$EVORA_OUT_DIR" && sha256sum *.zip csp-hashes.txt > SHA256SUMS)
          cat "$EVORA_OUT_DIR/SHA256SUMS"
          echo "EVORA_FONTS_DIR=$fwork/$fname" >> "$GITHUB_ENV"
          echo "EVORA_FONTS_ARTIFACT=$fname" >> "$GITHUB_ENV"
          {
            echo "### Polices servies à part (E6)"
            echo
            echo "craft-fonts \`${CRAFT_FONTS_REF}\` ; archive \`${fname}.zip\`, $(wc -c < "$EVORA_OUT_DIR/$fname.zip" | tr -d ' ') octets ; $(grep -cvE '^[[:space:]]*(#|$)' "$fwork/$fname/fonts/manifest.txt") lignes de manifeste ; polices hors du wasm, téléchargées à la demande."
            echo
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Portes Evora (marques, hébergement, licences, émojis, termes, CSP, taille)
        id: gates
        continue-on-error: true
        run: python3 -I evora/ci/gates.py "$EVORA_PKG_DIR" "$RUNNER_TEMP/evora-gates.json"

      - name: Test de fumée (Chrome sans interface, origine différente)
        id: smoke
        continue-on-error: true
        timeout-minutes: 20
        env:
          CHROME_BIN: google-chrome
          SMOKE_TIMEOUT_MS: "180000"
          # E3 : langue imposée par la coquille (?lang=), vérifiée dans les préférences du moteur.
          # E2 : thème Evora clair imposé (?theme=light), vérifié dans les préférences du moteur.
          # E5 corrigé : ?storageNs= et ?parentOrigin= (ancienne voie) restent dans l'URL pour prouver
          # qu'ils sont ignorés hors pont : noms de l'amont, et l'ancien message de purge sans effet.
          SMOKE_QUERY: "webgl&lang=fr&theme=light&storageNs=evoraSmokeNs0123&parentOrigin={{PARENT_ORIGIN}}"
          SMOKE_EXPECT_LANG: fr
          SMOKE_EXPECT_THEME: evoraLight
          # E6 : polices servies à part ; navigateur en japonais pour que le moteur en charge une.
          SMOKE_BROWSER_LANG: ja
          SMOKE_EXPECT_FONTS: "1"
          SMOKE_URL_STORAGE_NS: evoraSmokeNs0123
          SMOKE_OLD_PURGE: "1"
        run: |
          set +e
          # Hors pont : comportement amont (noms de stockage compris), avec la langue et le thème
          # des patchs E2 et E3.
          node evora/ci/smoke.mjs "$EVORA_PKG_DIR" "$EVORA_PKG_DIR/csp-hashes.txt" "$RUNNER_TEMP/evora-smoke.json" "$EVORA_FONTS_DIR"
          hors_pont=$?
          # E4 et E5 : pont hôte EHP v1 (?host=evora), coquille minimale et evora-host.json écrit par
          # le banc ; espace de noms et purge par le pont (evora/ci/smoke_ehp.mjs). Les attentes du
          # scénario hors pont ne s'appliquent pas ici.
          SMOKE_SCENARIO=pont-ehp SMOKE_QUERY="host=evora&webgl" SMOKE_EXPECT_LANG= SMOKE_EXPECT_THEME= \
            SMOKE_BROWSER_LANG= SMOKE_EXPECT_FONTS= SMOKE_URL_STORAGE_NS= SMOKE_OLD_PURGE= \
            node evora/ci/smoke.mjs "$EVORA_PKG_DIR" "$EVORA_PKG_DIR/csp-hashes.txt" "$RUNNER_TEMP/evora-smoke-ehp.json" "$EVORA_FONTS_DIR"
          pont=$?
          # E4 : pont muet. ?host=evora avec l'evora-host.json livré (vide) : aucun message à la page
          # parente, aucun démarrage, aucun stockage, et l'avertissement attendu.
          SMOKE_SCENARIO=pont-muet SMOKE_TIMEOUT_MS=15000 SMOKE_QUERY="host=evora&webgl" SMOKE_EXPECT_LANG= SMOKE_EXPECT_THEME= \
            SMOKE_BROWSER_LANG= SMOKE_EXPECT_FONTS= SMOKE_URL_STORAGE_NS= SMOKE_OLD_PURGE= \
            node evora/ci/smoke.mjs "$EVORA_PKG_DIR" "$EVORA_PKG_DIR/csp-hashes.txt" "$RUNNER_TEMP/evora-smoke-muet.json" "$EVORA_FONTS_DIR"
          muet=$?
          # Le banc sait-il rougir ? D'abord le verdict des témoins, éprouvé sans navigateur (chaque
          # façon de mentir doit rendre INVALIDE), puis trois témoins sabordés, VALIDES seulement si
          # leurs rouges sont exactement ceux attendus, chacun à sa place, et rien d'autre :
          # « banc » (le banc fabrique dix-sept défauts, messages du moteur et stockage), « moteur »
          # (removeItem, clear et deleteDatabase sans effet : le moteur croit purger), « muet » (le
          # banc admet à tort la page parente).
          node evora/ci/witness_selftest.mjs
          autotest=$?
          SMOKE_SCENARIO=pont-ehp SMOKE_SABOTAGE=banc SMOKE_QUERY="host=evora&webgl" SMOKE_EXPECT_LANG= SMOKE_EXPECT_THEME= \
            SMOKE_BROWSER_LANG= SMOKE_EXPECT_FONTS= SMOKE_URL_STORAGE_NS= SMOKE_OLD_PURGE= \
            node evora/ci/smoke.mjs "$EVORA_PKG_DIR" "$EVORA_PKG_DIR/csp-hashes.txt" "$RUNNER_TEMP/evora-smoke-temoin-banc.json" "$EVORA_FONTS_DIR"
          temoin_banc=$?
          SMOKE_SCENARIO=pont-ehp SMOKE_SABOTAGE=moteur SMOKE_QUERY="host=evora&webgl" SMOKE_EXPECT_LANG= SMOKE_EXPECT_THEME= \
            SMOKE_BROWSER_LANG= SMOKE_EXPECT_FONTS= SMOKE_URL_STORAGE_NS= SMOKE_OLD_PURGE= \
            node evora/ci/smoke.mjs "$EVORA_PKG_DIR" "$EVORA_PKG_DIR/csp-hashes.txt" "$RUNNER_TEMP/evora-smoke-temoin-moteur.json" "$EVORA_FONTS_DIR"
          temoin_moteur=$?
          SMOKE_SCENARIO=pont-muet SMOKE_SABOTAGE=muet SMOKE_TIMEOUT_MS=15000 SMOKE_QUERY="host=evora&webgl" SMOKE_EXPECT_LANG= SMOKE_EXPECT_THEME= \
            SMOKE_BROWSER_LANG= SMOKE_EXPECT_FONTS= SMOKE_URL_STORAGE_NS= SMOKE_OLD_PURGE= \
            node evora/ci/smoke.mjs "$EVORA_PKG_DIR" "$EVORA_PKG_DIR/csp-hashes.txt" "$RUNNER_TEMP/evora-smoke-temoin-muet.json" "$EVORA_FONTS_DIR"
          temoin_muet=$?
          # E5 pour plusieurs documents (HOST-PROTOCOL §7.7, evora/ci/smoke_docs.mjs) : trois documents
          # moteur de la même origine, comme trois onglets (compte A, puis compte B, puis un second
          # document de B) : à l'init de B, plus rien de A malgré son document ouvert, et A ne réécrit
          # plus ; la purge de B est accusée malgré son second document, plus rien ne reste, et ce
          # document ne réécrit plus. Variantes : normale ; sans indexedDB.databases() ; avec la seule
          # écoute versionchange ; avec la seule écoute storage. Puis son témoin sabordé « ecoutes »
          # (les deux écoutes neutralisées dans les documents moteur).
          SMOKE_DOCS_VARIANT=normal node evora/ci/smoke_docs.mjs "$EVORA_PKG_DIR" "$EVORA_PKG_DIR/csp-hashes.txt" "$RUNNER_TEMP/evora-smoke-docs.json"
          docs=$?
          SMOKE_DOCS_VARIANT=sans-liste node evora/ci/smoke_docs.mjs "$EVORA_PKG_DIR" "$EVORA_PKG_DIR/csp-hashes.txt" "$RUNNER_TEMP/evora-smoke-docs-sans-liste.json"
          docs_sans_liste=$?
          SMOKE_DOCS_VARIANT=versionchange node evora/ci/smoke_docs.mjs "$EVORA_PKG_DIR" "$EVORA_PKG_DIR/csp-hashes.txt" "$RUNNER_TEMP/evora-smoke-docs-versionchange.json"
          docs_versionchange=$?
          SMOKE_DOCS_VARIANT=storage node evora/ci/smoke_docs.mjs "$EVORA_PKG_DIR" "$EVORA_PKG_DIR/csp-hashes.txt" "$RUNNER_TEMP/evora-smoke-docs-storage.json"
          docs_storage=$?
          SMOKE_DOCS_VARIANT=normal SMOKE_SABOTAGE=ecoutes node evora/ci/smoke_docs.mjs "$EVORA_PKG_DIR" "$EVORA_PKG_DIR/csp-hashes.txt" "$RUNNER_TEMP/evora-smoke-temoin-ecoutes.json"
          temoin_ecoutes=$?
          echo "Test de fumée : hors pont $hors_pont, pont EHP $pont, pont muet $muet ; pont-documents $docs, sans liste $docs_sans_liste, versionchange seule $docs_versionchange, storage seule $docs_storage ; autotest des témoins $autotest, témoins banc $temoin_banc, moteur $temoin_moteur, muet $temoin_muet, ecoutes $temoin_ecoutes (0 = vert ou témoin VALIDE)"
          [ "$hors_pont" -eq 0 ] && [ "$pont" -eq 0 ] && [ "$muet" -eq 0 ] && [ "$autotest" -eq 0 ] \
            && [ "$temoin_banc" -eq 0 ] && [ "$temoin_moteur" -eq 0 ] && [ "$temoin_muet" -eq 0 ] \
            && [ "$docs" -eq 0 ] && [ "$docs_sans_liste" -eq 0 ] && [ "$docs_versionchange" -eq 0 ] && [ "$docs_storage" -eq 0 ] \
            && [ "$temoin_ecoutes" -eq 0 ]

      - name: Fumée de la panique (build evora-smoke, hors artefact)
        id: panic
        continue-on-error: true
        timeout-minutes: 30
        env:
          CHROME_BIN: google-chrome
          SMOKE_TIMEOUT_MS: "180000"
        run: |
          # LUM-04 (e) : un second build du moteur, avec la feature evora-smoke (la coquille admise peut
          # le faire paniquer), prouve que la panique parvient à la coquille en un seul evora:failed
          # {code: "panic"}. Ce build n'est jamais empaqueté : son marqueur doit être présent dans son
          # .wasm (sinon la recette ne prouve rien) et absent du .wasm servi. Même profil que le build
          # servi (cache cargo partagé), sans wasm-opt.
          smoke_dir="$RUNNER_TEMP/evora-web-smoke"
          (
            cd apps/photocraft-web
            sed 's/data-wasm-opt="z"/data-wasm-opt="0" data-cargo-features="evora-smoke"/' index.html > "$RUNNER_TEMP/index-smoke.html"
            grep -q 'data-cargo-features="evora-smoke"' "$RUNNER_TEMP/index-smoke.html"
            cp "$RUNNER_TEMP/index-smoke.html" index-smoke.html
            trunk --offline=true build --release --locked --dist "$smoke_dir" index-smoke.html
            rm -f index-smoke.html
            git diff --exit-code -- ../../Cargo.lock
          )
          [ -f "$smoke_dir/index.html" ] || mv "$smoke_dir/index-smoke.html" "$smoke_dir/index.html"
          python3 -I evora/ci/csp_hashes.py "$smoke_dir/index.html" "$smoke_dir/csp-hashes.txt"
          count() { # dossier : occurrences du marqueur dans ses .wasm
            python3 -I -c 'import glob, sys; print(sum(open(f, "rb").read().count(b"evora:smoke-panic") for f in glob.glob(sys.argv[1] + "/*.wasm")))' "$1"
          }
          smoke_hits=$(count "$smoke_dir")
          served_hits=$(count "$EVORA_PKG_DIR")
          {
            echo "### Fumée de la panique (build evora-smoke, LUM-04)"
            echo
            echo "Marqueur \`evora:smoke-panic\` : $smoke_hits occurrence(s) dans le build de fumée, $served_hits dans le .wasm servi (attendu : au moins 1, puis 0)."
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$smoke_hits" -ge 1 ] || { echo "::error::marqueur absent du build de fumée : la recette ne prouve rien"; exit 1; }
          [ "$served_hits" -eq 0 ] || { echo "::error::le marqueur du build de fumée est dans le .wasm servi"; exit 1; }
          SMOKE_SCENARIO=pont-panique SMOKE_QUERY="host=evora&webgl" \
            node evora/ci/smoke.mjs "$smoke_dir" "$smoke_dir/csp-hashes.txt" "$RUNNER_TEMP/evora-smoke-panique.json" "$EVORA_FONTS_DIR"

      - name: Bilan des portes
        env:
          DENY: ${{ steps.deny.outcome }}
          ABOUT: ${{ steps.about.outcome }}
          GATES: ${{ steps.gates.outcome }}
          SMOKE: ${{ steps.smoke.outcome }}
          PANIC: ${{ steps.panic.outcome }}
        run: |
          {
            echo "### Bilan des portes"
            echo
            echo "| Porte | Résultat |"
            echo "| --- | --- |"
            echo "| cargo-deny | $DENY |"
            echo "| cargo-about | $ABOUT |"
            echo "| Portes Evora | $GATES |"
            echo "| Test de fumée | $SMOKE |"
            echo "| Fumée de la panique (build evora-smoke) | $PANIC |"
          } >> "$GITHUB_STEP_SUMMARY"
          for o in "$DENY" "$ABOUT" "$GATES" "$SMOKE" "$PANIC"; do
            [ "$o" = "success" ] || { echo "::error::une porte bloquante a échoué (deny=$DENY about=$ABOUT gates=$GATES smoke=$SMOKE panic=$PANIC)"; exit 1; }
          done

      - name: Artefact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.EVORA_ARTIFACT }}
          path: |
            ${{ env.EVORA_OUT_DIR }}/${{ env.EVORA_ARTIFACT }}.zip
            ${{ env.EVORA_OUT_DIR }}/${{ env.EVORA_FONTS_ARTIFACT }}.zip
            ${{ env.EVORA_OUT_DIR }}/SHA256SUMS
            ${{ env.EVORA_OUT_DIR }}/csp-hashes.txt
          if-no-files-found: error
          compression-level: 0
